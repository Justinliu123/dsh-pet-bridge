# ============================================================================
# dsh-pet 的 bundle patch —— 把「数据通道」插件挂进 DSH 配置树
# ============================================================================
#
# 本包是主仓 dsh-pet（桌面 exe）的伴生插件，只做数据通道：
#   - 监听会话事件 → workStatus / notify 段
#   - 本机 loopback 暴露 GET /dsh-pet-7340/state
#   - 把宿主入口写进 <APPDATA>/dsh-pet/bridge/standalone-bridge.json
# 它没有 client 入口（不画页面内宠物）、不读配置、不轮询余额。
#
# 注意：`id:` 那一行绝不能写行尾注释（商城预检会 SUBMISSION_ENTRY_MISSING）。
# ============================================================================

- insert:
    - id: dsh-pet
      name: 'dsh-pet'
